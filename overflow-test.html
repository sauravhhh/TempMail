<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>overflow test</title></head>
<body>
<div id="t"></div>
<script>
function makeFrame(html){
  var f = document.createElement('iframe');
  f.setAttribute('sandbox', '');
  f.setAttribute('srcdoc',
    '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<style>' +
    '*{box-sizing:border-box;max-width:100%;}' +
    'html,body{margin:0!important;padding:0!important;overflow-x:hidden!important;}' +
    'body{padding:8px!important;font-family:sans-serif;font-size:14px;line-height:1.6;color:#111;overflow-wrap:anywhere!important;word-break:break-word;}' +
    'img{max-width:100%!important;height:auto!important;}' +
    'table{display:block!important;overflow-x:auto!important;max-width:100%!important;}' +
    'pre{white-space:pre-wrap!important;overflow-wrap:anywhere!important;}' +
    'a{overflow-wrap:anywhere!important;}' +
    '</style>' +
    '</head><body>' + html + '</body></html>');
  f.style.cssText = 'width:100%;max-width:100%;height:52vh;border:0;border-radius:8px;background:#fff;display:block;';
  return f;
}
var cases = {
  style_attack: '<style>body{width:2000px!important;background:red;}</style><p>style attack</p>',
  long_url: '<p>click https://example.com/' + 'a'.repeat(300) + '/verify?token=' + 'b'.repeat(200) + '</p>',
  wide_table: '<table border="1"><tr>' + '<td style="white-space:nowrap">wide-cell-data-here</td>'.repeat(20) + '</tr></table>',
  huge_img: '<img src="data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="100"><rect width="2000" height="100" fill="blue"/></svg>') + '">',
  long_pre: '<pre>' + 'x'.repeat(500) + '</pre>',
  nested_divs: '<div style="width:1500px"><div style="width:1200px">nested wide divs</div></div>'
};
var t = document.getElementById('t');
Object.keys(cases).forEach(function(k){
  var wrap = document.createElement('div');
  wrap.id = 'case-' + k;
  wrap.style.cssText = 'width:360px;border:2px solid #000;margin:10px;overflow:hidden;';
  wrap.appendChild(makeFrame(cases[k]));
  t.appendChild(wrap);
});
window.__cases = Object.keys(cases);
</script>
</body></html>
