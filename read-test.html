<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>readability test</title></head>
<body>
<div id="t"></div>
<script>
function makeFrame(html){
    var f = document.createElement('iframe');
    // allow-same-origin (no scripts) so we can auto-size the frame to its
    // content: the whole email reads in one page scroll, no nested scroller.
    f.setAttribute('sandbox', 'allow-same-origin');
    f.setAttribute('srcdoc',
      '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>' +
      '*{box-sizing:border-box;max-width:100%!important;}' +
      'html,body{margin:0!important;padding:0!important;overflow-x:hidden!important;}' +
      'body{padding:8px!important;font-family:sans-serif;font-size:14px;line-height:1.6;color:#111;overflow-wrap:anywhere!important;word-break:break-word;}' +
      'img{max-width:100%!important;height:auto!important;}' +
      'table{max-width:100%!important;}' +
      'pre{white-space:pre-wrap!important;overflow-wrap:anywhere!important;}' +
      'a{overflow-wrap:anywhere!important;}' +
      '</style>' +
      '</head><body>' + html + '</body></html>');
    f.style.cssText = 'width:100%;max-width:100%;height:160px;border:0;border-radius:8px;background:#fff;display:block;';
    function fit(){
      try {
        var d = f.contentDocument;
        if(d && d.documentElement){
          var h = Math.max(d.documentElement.scrollHeight, 120);
          f.style.height = h + 'px';
        }
      } catch(e){}
    }
    f.addEventListener('load', function(){
      fit();
      setTimeout(fit, 600);
      setTimeout(fit, 2000);
    });
    return f;
  }
// realistic table-based OTP email
var otpEmail = '<table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#f9f9f9;">' +
  '<tr><td style="padding:20px;text-align:center;background:#111;color:#fff;font-size:20px;">Acme App</td></tr>' +
  '<tr><td style="padding:30px;">' +
  '<p>Hi there,</p><p>Your verification code is:</p>' +
  '<table cellpadding="0" cellspacing="8" style="margin:0 auto;"><tr>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">4</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">8</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">1</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">5</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">9</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">2</td>' +
  '</tr></table>' +
  '<p>This code expires in 10 minutes. If you did not request this, ignore this email.</p>' +
  '</td></tr>' +
  '<tr><td style="padding:15px;text-align:center;color:#888;font-size:12px;">© 2026 Acme Inc. All rights reserved.</td></tr>' +
  '</table>';
var wrap = document.createElement('div');
wrap.style.cssText = 'width:360px;border:2px solid #000;margin:10px;overflow:hidden;';
wrap.appendChild(makeFrame(otpEmail));
document.getElementById('t').appendChild(wrap);
</script>
</body></html>
