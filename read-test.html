<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>readability test</title></head>
<body>
<div id="dbg" style="font:14px monospace;padding:10px;background:#ffffcc;border:2px solid #000;margin:10px;word-break:break-all;"></div><div id="t"></div>
<script>
function makeFrame(html){
    var f = document.createElement('iframe');
    // allow-same-origin but NO scripts: the parent can measure and scale the
    // email to fit, while email JavaScript stays blocked.
    f.setAttribute('sandbox', 'allow-same-origin');
    f.setAttribute('srcdoc',
      '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>' +
      'html,body{margin:0!important;padding:0!important;}' +
      'body{padding:8px;font-family:sans-serif;font-size:14px;line-height:1.6;color:#111;overflow-wrap:anywhere;word-break:break-word;}' +
      'img{max-width:100%;height:auto;}' +
      'pre{white-space:pre-wrap;overflow-wrap:anywhere;}' +
      'a{overflow-wrap:anywhere;}' +
      '#emroot{}' +
      '</style>' +
      '</head><body><div id="emroot">' + html + '</div></body></html>');
    f.style.cssText = 'width:100%;max-width:100%;height:160px;border:0;border-radius:8px;background:#fff;display:block;overflow:hidden;';
    var dbg = document.getElementById('dbg');
    function fit(){
      try {
        var d = f.contentDocument;
        if(!d) return;
        var root = d.getElementById('emroot');
        if(!root) return;
        root.style.zoom = '';
        var availW = f.clientWidth || 320;
        var natW = root.scrollWidth || availW;
        var natH = root.scrollHeight || 120;
        if(natW > availW + 1){
          // zoom (unlike transform) shrinks the layout too, so no scrollbar
          var s = availW / natW;
          root.style.zoom = s;
          f.style.height = Math.ceil(natH * s + 16) + 'px';
        } else {
          f.style.height = Math.ceil(natH + 16) + 'px';
        }
        dbg.textContent = 'availW=' + availW + ' natW=' + natW + ' natH=' + natH + ' zoom=' + (natW > availW + 1 ? (availW/natW).toFixed(3) : 'none') + ' finalH=' + f.style.height;
      } catch(e){ dbg.textContent = 'EXC: ' + e.message; }
    }
    f.addEventListener('load', function(){
      fit();
      setTimeout(fit, 600);
      setTimeout(fit, 2000);
    });
    return f;
  }
// realistic table-based OTP email
var otpEmail = '<table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#f9f9f9;">' +
  '<tr><td style="padding:20px;text-align:center;background:#111;color:#fff;font-size:20px;">Acme App</td></tr>' +
  '<tr><td style="padding:30px;">' +
  '<p>Hi there,</p><p>Your verification code is:</p>' +
  '<table cellpadding="0" cellspacing="8" style="margin:0 auto;"><tr>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">4</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">8</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">1</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">5</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">9</td>' +
  '<td style="background:#fff;border:1px solid #ddd;font-size:28px;padding:10px 14px;">2</td>' +
  '</tr></table>' +
  '<p>This code expires in 10 minutes. If you did not request this, ignore this email.</p>' +
  '</td></tr>' +
  '<tr><td style="padding:15px;text-align:center;color:#888;font-size:12px;">© 2026 Acme Inc. All rights reserved.</td></tr>' +
  '</table>';
var wrap = document.createElement('div');
wrap.style.cssText = 'width:360px;border:2px solid #000;margin:10px;overflow:hidden;';
wrap.appendChild(makeFrame(otpEmail));
document.getElementById('t').appendChild(wrap);
</script>
</body></html>
