<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TempMail</title>
<meta name="description" content="Disposable temporary email inbox.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<style>
:root{
  --bg:#ffffff; --text:#111111; --muted:#6b6b6b; --card:#f4f4f4;
  --border:#e2e2e2; --accent:#c8102e; --green:#1a7f37;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d0d0d; --text:#f2f2f2; --muted:#9a9a9a; --card:#161616; --border:#2a2a2a; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}
.wrap{max-width:560px; margin:0 auto; padding:20px 16px 40px;}
header{display:flex; align-items:center; gap:12px; margin-bottom:20px;}
header img{width:40px; height:40px; border-radius:10px;}
header h1{font-size:22px; margin:0; font-weight:700; letter-spacing:-.3px;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:18px; margin-bottom:16px;
}
.addr-label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px;}
.addr{
  font-size:19px; font-weight:700; color:var(--accent); word-break:break-all;
  margin-bottom:14px; cursor:pointer; line-height:1.4;
}
.row{display:flex; gap:10px;}
button{
  font-family:inherit; cursor:pointer; border-radius:12px; font-size:15px; font-weight:700;
}
.btn-copy{
  flex:1; padding:13px; border:1px solid var(--border); background:var(--bg); color:var(--text);
}
.btn-new{
  flex:1; padding:13px; border:none; background:var(--text); color:var(--bg);
}
.btn-set{
  padding:12px 16px; border:none; background:var(--text); color:var(--bg); border-radius:12px;
  font-size:14px;
}
button:disabled{opacity:.5; cursor:wait;}
.custom{display:flex; gap:10px; margin-top:12px;}
.custom input{
  flex:1; padding:12px 14px; font-size:15px; border:1px solid var(--border); border-radius:12px;
  background:var(--bg); color:var(--text); font-family:inherit; min-width:0;
}
.custom input::placeholder{color:var(--muted);}
.inbox-head{display:flex; align-items:center; justify-content:space-between; margin:22px 2px 12px;}
.inbox-head h2{font-size:17px; margin:0;}
.inbox-tools{display:flex; align-items:center; gap:10px;}
.btn-refresh{
  padding:8px 14px; font-size:13px; font-weight:700;
  border:1px solid var(--border); border-radius:10px;
  background:var(--bg); color:var(--text);
}
.status{font-size:13px; color:var(--muted);}
.status .dotpulse{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:6px; animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.mail{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px 16px; margin-bottom:10px; cursor:pointer;
}
.mail.unread{border-left:4px solid var(--accent);}
.mail-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
.mail-from{font-weight:700; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mail-time{font-size:12px; color:var(--muted); white-space:nowrap;}
.mail-sub{font-size:14px; color:var(--muted); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mail.unread .mail-sub{color:var(--text); font-weight:600;}
.mail-body{
  display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
  font-size:14px; line-height:1.6; word-break:break-word; overflow:hidden; min-width:0;
}
.mail.open .mail-body{display:block;}
.mail-body img{max-width:100%; height:auto;}
.empty{
  text-align:center; color:var(--muted); padding:44px 20px; font-size:15px;
  border:1px dashed var(--border); border-radius:14px; line-height:1.6;
}
.foot{margin-top:26px; text-align:center; font-size:12px; color:var(--muted); line-height:1.7;}
#toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
  background:var(--text); color:var(--bg); padding:12px 20px; border-radius:24px;
  font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s;
  max-width:90vw; text-align:center; z-index:50;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="TempMail icon">
    <h1>TempMail</h1>
  </header>

  <div class="card">
    <div class="addr-label">Your temporary address</div>
    <div class="addr" id="addr" title="Tap to copy">…</div>
    <div class="row">
      <button class="btn-copy" id="copy">Copy</button>
      <button class="btn-new" id="newaddr">New address</button>
    </div>
    <div class="custom">
      <input id="customname" type="text" placeholder="Custom name (optional)" maxlength="30" autocapitalize="off" spellcheck="false">
      <button class="btn-set" id="setname">Set</button>
    </div>
  </div>

  <div class="inbox-head">
    <h2>Inbox</h2>
    <div class="inbox-tools">
      <span class="status" id="status"><span class="dotpulse"></span>Live</span>
      <button id="refresh" class="btn-refresh">Refresh</button>
    </div>
  </div>
  <div id="inbox"></div>

  <div class="foot">
    Addresses expire after about 60 minutes of inactivity.<br>
    Inbox refreshes automatically every minute.
  </div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
